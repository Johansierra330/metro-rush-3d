<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------- Telegram ---------- */
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand(); tg?.disableVerticalSwipes?.();
tg?.setHeaderColor?.('#10182f'); tg?.setBackgroundColor?.('#10182f');
const $ = s => document.querySelector(s);
const scoreEl=$('#score'), coinsEl=$('#coins'), bestEl=$('#best'), statusEl=$('#status'), hintEl=$('#hint');

/* ---------- Récord (localStorage + Telegram CloudStorage) ---------- */
let best = 0;
try { best = +localStorage.getItem('mr_best') || 0; } catch(e){}
bestEl.textContent = best;

function saveBest(){
  try { localStorage.setItem('mr_best', best); } catch(e){}
  persist();
}

/* ---------- Sonido (WebAudio, sin archivos) ---------- */
let ac, muted = false;
function beep(f, d=.08, type='square', v=.05, to=0){
  if(muted || !ac) return;
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d);
}
const sfx = {
  coin:()=>{beep(880,.07,'square',.04);setTimeout(()=>beep(1320,.09,'square',.04),55)},
  jump:()=>beep(300,.15,'sine',.08,700),
  slide:()=>beep(400,.15,'sine',.06,150),
  lane:()=>beep(220,.05,'triangle',.05),
  power:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.06),i*70))},
  hit:()=>beep(160,.35,'sawtooth',.1,40),
  shield:()=>beep(500,.25,'triangle',.08,120)
};
$('#mute').addEventListener('click', e => { e.stopPropagation(); muted=!muted; $('#mute').textContent = muted?'🔇':'🔊'; });

/* ---------- Escena ---------- */
const root=$('#game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8bd7ff); scene.fog=new THREE.Fog(0x8bd7ff,30,110);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180); camera.position.set(0,5.3,9.5);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x657083,1.55));
const sun=new THREE.DirectionalLight(0xfff1db,2.5); sun.position.set(-5,12,7); sun.castShadow=true;
sun.shadow.camera.left=-12; sun.shadow.camera.right=12; sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14; sun.shadow.mapSize.set(1024,1024); sun.shadow.bias=-.0004; sun.shadow.normalBias=.025;
scene.add(sun); scene.add(sun.target);

const M=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const mGround=M(0x343c4b), mRail=M(0x8995a6,.4), mDark=M(0x182638), mRed=M(0xff654f), mBlue=M(0x21a4ff), mGold=new THREE.MeshStandardMaterial({color:0xffd43b,roughness:.3,metalness:.6,emissive:0x553d00}), mSkin=M(0xffc99c), mPants=M(0x263b70);
const LANES=[-2.2,0,2.2], PZ=3;

// Geometrías compartidas (menos memoria, más FPS)
const G={
  trainBody:new THREE.BoxGeometry(1.85,2.7,5), trainFront:new THREE.BoxGeometry(1.35,.85,.08), wheel:new THREE.CylinderGeometry(.23,.23,.18,12),
  barBase:new THREE.BoxGeometry(1.7,.8,.55), barPost:new THREE.BoxGeometry(.15,1.3,.15),
  beam:new THREE.BoxGeometry(2,.35,.4), beamPost:new THREE.BoxGeometry(.2,2.2,.3),
  coin:new THREE.TorusGeometry(.28,.09,10,18), sleeper:new THREE.BoxGeometry(7,.12,.25), bld:new THREE.BoxGeometry(1,1,3)
};
const mWindow=M(0x9deaff,.2), mYellow=M(0xffd43b), mStripe=M(0xffffff);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,200),mGround); floor.rotation.x=-Math.PI/2; floor.position.z=-60; floor.receiveShadow=true; scene.add(floor);
/* ---------- Entorno: reflejos, vías y sombras ---------- */
const UNIT=new THREE.BoxGeometry(1,1,1);
const envC=document.createElement('canvas'); envC.width=256; envC.height=128;
{ const g=envC.getContext('2d'), gr=g.createLinearGradient(0,0,0,128); gr.addColorStop(0,'#7fb8ff'); gr.addColorStop(.5,'#ffffff'); gr.addColorStop(.55,'#9aa7b8'); gr.addColorStop(1,'#2a3140'); g.fillStyle=gr; g.fillRect(0,0,256,128); }
const envTex=new THREE.CanvasTexture(envC); envTex.mapping=THREE.EquirectangularReflectionMapping; envTex.colorSpace=THREE.SRGBColorSpace;
const mGlass=new THREE.MeshStandardMaterial({color:0xbfeaff,roughness:.08,metalness:.6,envMap:envTex,envMapIntensity:1,emissive:0x0b2740});
const mFut=new THREE.MeshStandardMaterial({color:0x2b3446,roughness:.3,metalness:.85,envMap:envTex,envMapIntensity:1});
const mRailTop=new THREE.MeshStandardMaterial({color:0xb7c0cc,roughness:.25,metalness:.9,envMap:envTex});
const mNeonC=new THREE.MeshBasicMaterial({color:0x2fe6ff}), mNeonM=new THREE.MeshBasicMaterial({color:0xff3fa4}), mNeonY=new THREE.MeshBasicMaterial({color:0xffe14d}), mNeonG=new THREE.MeshBasicMaterial({color:0x5dff8a});
const mLight=new THREE.MeshBasicMaterial({color:0xfff2a8}), mTail=new THREE.MeshBasicMaterial({color:0xff2a2a});
const blobGeo=new THREE.PlaneGeometry(1,1), blobMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false});
function blob(g,sx,sz){ const m=new THREE.Mesh(blobGeo,blobMat); m.rotation.x=-Math.PI/2; m.scale.set(sx,sz,1); m.position.y=.03; g.add(m); }
function P(g,mat,sx,sy,sz,x,y,z,sh){ const m=new THREE.Mesh(UNIT,mat); m.scale.set(sx,sy,sz); m.position.set(x,y,z); if(sh) m.castShadow=true; g.add(m); return m; }
let winEmi=.1;
// Balasto (grava) con textura que se desplaza para dar sensación de velocidad
const bc=document.createElement('canvas'); bc.width=bc.height=512;
{ const g=bc.getContext('2d'); g.fillStyle='#55545a'; g.fillRect(0,0,512,512); for(let k=0;k<6500;k++){const x=Math.random()*512,y=Math.random()*512,r=2+Math.random()*5,v=65+Math.floor(Math.random()*95);g.beginPath();for(let j=0;j<6;j++){const a=j*Math.PI/3,rr=r*(.7+Math.random()*.4);g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fillStyle=`rgb(${v},${v},${v+3})`;g.fill();g.strokeStyle='#33343a55';g.stroke();} }
const ballTex=new THREE.CanvasTexture(bc); ballTex.wrapS=ballTex.wrapT=THREE.RepeatWrapping; ballTex.repeat.set(3,40); ballTex.colorSpace=THREE.SRGBColorSpace; ballTex.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
const mBallast=new THREE.MeshStandardMaterial({map:ballTex,roughness:1,color:0xbbbbbb});
const ballast=new THREE.Mesh(new THREE.PlaneGeometry(7.6,200),mBallast); ballast.rotation.x=-Math.PI/2; ballast.position.set(0,.015,-60); ballast.receiveShadow=true; scene.add(ballast);
// Rieles con cabeza metálica brillante
const railGeo=new THREE.BoxGeometry(.12,.12,200), railTopGeo=new THREE.BoxGeometry(.07,.04,200);
for(const x of LANES) for(const s of [-.65,.65]){ const r=new THREE.Mesh(railGeo,mRail); r.position.set(x+s,.12,-60); scene.add(r); const t=new THREE.Mesh(railTopGeo,mRailTop); t.position.set(x+s,.2,-60); scene.add(t); }


// Durmientes y edificios que se reciclan (efecto de movimiento infinito)
const mWood=M(0x5b4636,.9), mFast=M(0x3a4352,.5);
const sleepers=[]; for(let j=0;j<100;j++){ const s=new THREE.Mesh(G.sleeper,mWood); s.position.set(0,.045,10-j*1.4); s.receiveShadow=true; scene.add(s); sleepers.push(s); }
const fasteners=new THREE.InstancedMesh(new THREE.BoxGeometry(.3,.05,.2),mFast,sleepers.length*6); fasteners.frustumCulled=false; scene.add(fasteners);
const _d=new THREE.Object3D();
function updateFasteners(){ let n=0; for(const s of sleepers) for(const x of LANES) for(const sd of [-.65,.65]){ _d.position.set(x+sd,.11,s.position.z); _d.updateMatrix(); fasteners.setMatrixAt(n++,_d.matrix); } fasteners.instanceMatrix.needsUpdate=true; }
updateFasteners();

/* ---------- Ciudad: edificios con ventanas, neones y props ---------- */
function makeWinTex(lit){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.fillStyle=lit?'#000':'#cfd6e0'; g.fillRect(0,0,128,128);
  for(let y=0;y<4;y++) for(let x=0;x<4;x++){
    const on=((x*7+y*13+3)%5)<2;
    g.fillStyle=lit?(on?'#fff':'#000'):(on?'#ffe9a6':'#5f7a99');
    g.fillRect(x*32+7,y*32+6,18,20);
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
const winMap=makeWinTex(false), winEmiMap=makeWinTex(true), neonMats=[mNeonM,mNeonC,mNeonY,mNeonG];
const buildings=[];
for(let i=0;i<30;i++){
  const h=4+Math.random()*(Math.random()<.3?26:12), w=2+Math.random()*3;
  const map=winMap.clone(), emi=winEmiMap.clone(); map.repeat.set(w/1.6,h/1.6); emi.repeat.copy(map.repeat);
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,3),new THREE.MeshStandardMaterial({color:[0x9fa9b4,0xc6b7a0,0x728d9e,0xa6a5a1][i%4],map,emissive:0xffd27a,emissiveMap:emi,emissiveIntensity:winEmi,roughness:.8}));
  b.userData.h=h; const side=i%2?1:-1; b.position.set(side*(9+Math.random()*8),h/2-.2,-i*5+10);
  const roof=P(b,mDark,w*.4,1,1.2,0,h/2+.5,0); roof.castShadow=false;
  if(Math.random()<.55){ const sg=new THREE.Mesh(blobGeo,neonMats[Math.floor(Math.random()*4)]); sg.scale.set(w*.7,1+Math.random(),1); sg.position.set(-side*(w/2+.03),-h/2+1.5+Math.random()*Math.max(1,h-3),0); sg.rotation.y=side>0?-Math.PI/2:Math.PI/2; b.add(sg); }
  if(i%3===0){ for(let j=0;j<Math.min(5,Math.floor(h/2));j++){ const y=-h/2+1.5+j*2; P(b,mDark,.18,.12,2.7,-side*(w/2+.12),y,0); P(b,mGlass,.06,.45,2.4,-side*(w/2+.22),y+.25,0); } }
  if(i%4===0){P(b,mFut,w*.7,.35,2.8,0,h/2+.18,0); P(b,mNeonC,.08,.12,2.8,-side*(w/2+.04),h/2-.2,0);}
  scene.add(b); buildings.push(b);
}
// Props laterales: farolas, árboles, bancas y señales ferroviarias
const mLeaf=M(0x2fbf4a,.9), mTrunk=M(0x6b4a2f), mProp=M(0x5a6475,.5), mBench=M(0x8a5a2b,.8);
const mLampHead=new THREE.MeshStandardMaterial({color:0xfff2b0,emissive:0xffe9a0,emissiveIntensity:.6});
const poleGeo=new THREE.CylinderGeometry(.06,.07,4.2,8), trunkGeo=new THREE.CylinderGeometry(.12,.17,1.6,8), leafGeo=new THREE.SphereGeometry(.95,14,10), headGeo=new THREE.SphereGeometry(.22,10,8), lightGeo=new THREE.SphereGeometry(.12,8,6);
const props=[];
function mkProp(){
  const g=new THREE.Group(), lamp=new THREE.Group(), tree=new THREE.Group(), bench=new THREE.Group(), sig=new THREE.Group();
  let m=new THREE.Mesh(poleGeo,mProp); m.position.y=2.1; lamp.add(m); m=new THREE.Mesh(headGeo,mLampHead); m.position.y=4.3; lamp.add(m);
  m=new THREE.Mesh(trunkGeo,mTrunk); m.position.y=.8; tree.add(m); m=new THREE.Mesh(leafGeo,mLeaf); m.position.y=2.4; m.scale.set(.75,1.05,.75);tree.add(m); for(const [x,y,z,k] of [[-.48,2.05,.12,.62],[.46,2.25,-.1,.68],[0,2.95,0,.58]]){const leaf=new THREE.Mesh(leafGeo,mLeaf);leaf.position.set(x,y,z);leaf.scale.setScalar(k);tree.add(leaf);}
  P(bench,mBench,1.4,.1,.5,0,.5,0); P(bench,mBench,1.4,.5,.08,0,.85,-.22); P(bench,mProp,.08,.5,.4,-.6,.25,0); P(bench,mProp,.08,.5,.4,.6,.25,0);
  m=new THREE.Mesh(poleGeo,mProp); m.scale.y=.75; m.position.y=1.6; sig.add(m); P(sig,mDark,.4,.9,.3,0,3.3,0);
  m=new THREE.Mesh(lightGeo,new THREE.MeshBasicMaterial({color:0xff3b3b})); m.position.set(0,3.55,.17); sig.add(m);
  m=new THREE.Mesh(lightGeo,new THREE.MeshBasicMaterial({color:0x3bff6e})); m.position.set(0,3.1,.17); sig.add(m);
  g.add(lamp,tree,bench,sig); g.userData.v=[lamp,tree,bench,sig]; return g;
}
function randomizeProp(p){
  const r=Math.random(), k=r<.3?0:r<.65?1:r<.8?2:3;
  p.userData.v.forEach((v,j)=>v.visible=j===k);
  p.position.x=p.userData.side*(4.7+Math.random()*1.6);
  p.rotation.y=k===3?0:k===2?(p.userData.side>0?-Math.PI/2:Math.PI/2):Math.random()*6;
}
for(let i=0;i<18;i++){ const p=mkProp(); p.userData.side=i%2?1:-1; p.position.z=-i*8+10; randomizeProp(p); scene.add(p); props.push(p); }

/* V12: infraestructura reciclable, fuera del espacio de juego */
const districtMat=M(0x657486), platformMat=M(0x9da7b4), roofMat=M(0x34465b), edgeMat=M(0xffcf45);
const districts=[];
function signTexture(label){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#14283f';g.fillRect(0,0,512,128);g.fillStyle='#5ceaff';g.fillRect(0,112,512,8);g.fillStyle='#ffffff';g.font='bold 48px sans-serif';g.textAlign='center';g.fillText(label,256,80);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const signs=['METRO CENTRAL','NOVA STATION','SAKURA','POLAR METRO','OASIS','ORBITAL'].map(n=>new THREE.MeshBasicMaterial({map:signTexture(n)}));
const pavement=new THREE.Mesh(new THREE.PlaneGeometry(22,200),districtMat);pavement.rotation.x=-Math.PI/2;pavement.position.set(0,-.025,-60);scene.add(pavement);
for(let i=0;i<4;i++){const g=new THREE.Group();const station=i%2===0;

  running=false; $('#pauseNotice').classList.add('hidden'); sfx.hit(); shake=.6;
  tg?.HapticFeedback?.notificationOccurred?.('error');
  const d=Math.floor(score), record=d>best; wallet+=coins; const gain=finishRun(d,coins);
  if(record){ best=d; bestEl.textContent=best; saveBest(); }
  $('#message').innerHTML=`${record?'🏆 ¡NUEVO RÉCORD!':'¡Buen intento!'}<br>Distancia: <b>${d} m</b> · Monedas: <b>${coins}</b><br>Mejor: <b>${best} m</b> · 🪙 ${wallet}${gain.length?'<br>'+gain.join('<br>'):''}`;
  $('#start').textContent='VOLVER A JUGAR';
  setTimeout(()=>$('#overlay').classList.remove('hidden'),650);
}

function move(d){ if(!running||paused) return; const n=Math.max(0,Math.min(2,lane+d)); if(n!==lane){ lane=n; sfx.lane(); } }
function togglePause(){
  if(!running) return;
  paused=!paused;
  $('#pauseBtn').textContent=paused?'▶️':'⏸️';
  $('#pauseNotice').classList.toggle('hidden',!paused);
}

function action(a){
  if(!running||paused) return;
  if(a==='jump'&&player.position.y<=.01){ jumpV=bootsT>0?14.5:9.5; runJumps++; slideT=0; sfx.jump(); tg?.HapticFeedback?.impactOccurred?.('light'); }
  if(a==='slide'){ slideT=.7; if(player.position.y>.01) jumpV=-14; else sfx.slide(); } // deslizar en el aire = caída rápida
}

/* ---------- Entrada: el swipe responde al mover el dedo ---------- */
let sx=0, sy=0, consumed=false;
addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; consumed=false; },{passive:true});
addEventListener('touchmove',e=>{
  if(consumed) return;
  const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<28) return;
  consumed=true;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1); else action(dy<0?'jump':'slide');
},{passive:true});
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') move(-1);
  if(k==='ArrowRight'||k==='d') move(1);
  if(k==='ArrowUp'||k==='w'||k===' ') action('jump');
  if(k==='ArrowDown'||k==='s') action('slide');
  if(k==='p'&&running) togglePause();
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running) paused=true; });

const hash=s=>{ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; };
function ensureMissions(){
  const d=new Date(), dk=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  const wk=d.getFullYear()+'w'+Math.floor((d-new Date(d.getFullYear(),0,1))/6048e5);
  if(!sv.mis) sv.mis={};
  if(sv.mis.day!==dk){
    const pool=[...MPOOL], list=[]; let h=hash(dk);
    for(let i=0;i<3;i++){ const m=pool.splice(h%pool.length,1)[0]; h=Math.floor(h/7)+i*13+5; const lv=hash(dk+m.id)%3; list.push({id:m.id,g:m.g[lv],r:m.r[lv],p:0,done:false}); }
    sv.mis.day=dk; sv.mis.list=list;
  }
  if(sv.mis.week!==wk){ sv.mis.week=wk; sv.mis.w={g:3000,r:150,p:0,done:false}; }
}
function applyStartItems(){
  const i=sv.inv;

}
function finishRun(d,runCoins){
  const gain=[];
  sv.games++; sv.dist+=d; sv.coins+=runCoins; sv.jumps+=runJumps; sv.power+=runPower; sv.best=Math.max(sv.best,d);
  const oldLv=level(); sv.xp+=d+runCoins*2;
  ensureMissions();
  const vals={coins:runCoins,dist:d,jumps:runJumps,power:runPower,games:1};
  for(const m of sv.mis.list){
    if(m.done) continue; const def=MPOOL.find(x=>x.id===m.id);
    m.p=def.run?Math.max(m.p,vals[def.k]):m.p+vals[def.k];
    if(m.p>=m.g){ m.done=true; wallet+=m.r; gain.push(`🎯 Misión cumplida +${m.r}🪙`); }
  }
  const w=sv.mis.w; if(!w.done){ w.p+=d; if(w.p>=w.g){ w.done=true; wallet+=w.r; gain.push(`📅 Misión semanal +${w.r}🪙`); } }
  for(const a of ACH) if(!sv.ach[a.id]&&a.c()){ sv.ach[a.id]=1; wallet+=a.r; gain.push(`🏆 ${a.n} +${a.r}🪙`); }
  if(level()>oldLv) gain.push(`⭐ ¡Subiste al nivel ${level()}!`);
  sv.top.push(d); sv.top.sort((a,b)=>b-a); sv.top=sv.top.slice(0,5);
  saveSv(); saveWallet(); updateMenu(); return gain;
}

/* ---------- Bucle principal ---------- */
let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(Math.max((now-last)/1000,0),.04); last=now;

  if(running&&!paused){
    speed=Math.min(34,18+score*.01);
    score+=dt*speed*.55; scoreEl.textContent=Math.floor(score);

    // Generación por distancia recorrida
    distRow+=speed*dt;
    const gap=Math.max(13,22-speed*.28);
    while(distRow>=gap){ distRow-=gap; spawnRow(-100); }

    // Movimiento lateral, salto, deslizamiento
    const tx=LANES[lane];
    player.position.x+=(tx-player.position.x)*(1-Math.exp(-dt*16));
    player.rotation.z=(tx-player.position.x)*-.12;
    player.rotation.y=-(tx-player.position.x)*.18;
    if(jetT>0){ player.position.y+=(4.5-player.position.y)*(1-Math.exp(-dt*6)); jumpV=0; }
    else if(player.position.y>0||jumpV>0){
      jumpV-=26*dt; player.position.y+=jumpV*dt;
      if(player.position.y<=0){ player.position.y=0; jumpV=0; landSq=.18; }
    }
    slideT=Math.max(0,slideT-dt);
    slideK+=((slideT>0?1:0)-slideK)*(1-Math.exp(-dt*20));
    landSq=Math.max(0,landSq-dt*.9);
    // Blended articulated poses: sprint, jump, slide, landing and hover.
    runT+=dt*(7.5+speed*.24);
    const air=player.position.y>.05 || jumpV>0;
    const blend=1-Math.exp(-dt*18);
    const mix=(a,b,t)=>a+(b-a)*t;
    const pose=(obj,x,y,z)=>{obj.rotation.x=mix(obj.rotation.x,x,blend);obj.rotation.y=mix(obj.rotation.y,y,blend);obj.rotation.z=mix(obj.rotation.z,z,blend);};
    const crouch=slideK, landing=landSq;
    body.scale.set(1,1,1);
    body.position.y=mix(body.position.y,air?0:(.035*Math.cos(runT*2)-.04)*(1-crouch)-.58*crouch-landing*.6,blend);
    pose(body,.12+.67*crouch+landing*.5,Math.PI,.035*Math.sin(runT)*(air?0:1-crouch));
    limbs.legs.forEach((l,i)=>{
      const phase=runT+i*Math.PI, stride=Math.sin(phase);
      let hip=.78*stride, knee=-.10-1.12*Math.max(0,-stride);
      if(air){hip=i===0?.65:.15;knee=i===0?-1.15:-.7;}
      if(hoverT>0&&!air){hip=.35;knee=-.65;}
      pose(l.hip,mix(hip,.95,crouch)+landing*.7,0,0);
      pose(l.knee,mix(knee,-1.55,crouch)-landing,0,0);
    });
    limbs.arms.forEach((a,i)=>{
      const stride=Math.sin(runT+i*Math.PI);
      let shoulder=-stride*.78, elbow=.95+.22*stride;
      if(air){shoulder=-.65;elbow=.6;}
      pose(a.shoulder,mix(shoulder,-.5,crouch),0,(i===0?1:-1)*(.08+(air?.18:0)));
      pose(a.elbow,mix(elbow,.35,crouch),0,0);
    });
    if(headRig)pose(headRig,-.08-.35*crouch,0,-body.rotation.z*.7);
    if(bagRig)pose(bagRig,air?-.08:.08*Math.sin(runT*2),0,.05*Math.sin(runT));

    // Power-ups
    magnetT=Math.max(0,magnetT-dt); bootsT=Math.max(0,bootsT-dt); x2T=Math.max(0,x2T-dt); hoverT=Math.max(0,hoverT-dt); invuln=Math.max(0,invuln-dt); bannerT=Math.max(0,bannerT-dt);
    if(jetT>0){ jetT-=dt; if(jetT<=0){ jetT=0; invuln=1.5; } }
    body.visible=invuln<=0||Math.floor(now/90)%2===0;
    const wi=(Math.floor(score/500)+1)%WORLDS.length; if(wi!==worldIdx){ worldIdx=wi; bannerT=3; }
    shieldMesh.visible=shield; jetMesh.visible=jetT>0; hoverMesh.visible=hoverT>0; if(jetT>0) flame.scale.y=.8+Math.random()*.6;
    statusEl.textContent=(bannerT>0?`🌍 ${WORLDS[worldIdx].n}  `:'')+(shield?'🛡️ ':'')+(hoverT>0?`🛹 ${Math.ceil(hoverT)}s `:'')+(magnetT>0?`🧲 ${Math.ceil(magnetT)}s `:'')+(jetT>0?`🚀 ${Math.ceil(jetT)}s `:'')+(bootsT>0?`👟 ${Math.ceil(bootsT)}s `:'')+(x2T>0?`✖️2 ${Math.ceil(x2T)}s`:'');

    // Mundo en movimiento
    advanceDistricts(dt);
    sleepers.forEach(s=>{ s.position.z+=speed*dt; if(s.position.z>10) s.position.z-=140; }); updateFasteners(); ballTex.offset.y+=speed*dt/5;
    buildings.forEach(b=>{ b.position.z+=speed*dt; if(b.position.z>12){ b.position.z-=150; recolor(b); } });
    props.forEach(p=>{ p.position.z+=speed*dt; if(p.position.z>12){ p.position.z-=150; randomizeProp(p); } });

    // Obstáculos y colisiones
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i], m=o.mesh;
      m.position.z+=speed*dt;
      if(m.position.z>9){ scene.remove(m); obstacles.splice(i,1); continue; }
      if(Math.abs(m.position.z-PZ)<o.depth && Math.abs(m.position.x-player.position.x)<1.0){
        const y=player.position.y;
        const hit = o.type==='train' ? y<2.9
                  : o.type==='barrier' ? y<.85
                  : slideT<=0; // beam
        if(running&&hit&&jetT<=0&&invuln<=0){
          if(shield){ shield=false; shake=.3; sfx.shield(); tg?.HapticFeedback?.impactOccurred?.('heavy'); scene.remove(m); obstacles.splice(i,1); }
          else if(hoverT>0){ hoverT=0; invuln=1.5; shake=.3; sfx.shield(); scene.remove(m); obstacles.splice(i,1); }
          else { m.position.z=Math.min(m.position.z,PZ-o.depth-.15); gameOver(); break; }
        }
      }
    }

    // Monedas y power-ups
    for(let i=pickups.length-1;running&&i>=0;i--){
      const p=pickups[i], m=p.mesh;
      m.position.z+=speed*dt; m.rotation.z+=dt*3; if(p.kind!=='coin') m.rotation.y+=dt*2;
      if((magnetT>0||jetT>0)&&(p.kind==='coin'||p.kind==='gem')&&m.position.z>-14&&m.position.z<PZ+2){
        m.position.x+=(player.position.x-m.position.x)*Math.min(1,dt*9);
        m.position.y+=(player.position.y+1.2-m.position.y)*Math.min(1,dt*9);
      }
      if(m.position.z>8){ scene.remove(m); pickups.splice(i,1); continue; }
      if(Math.abs(m.position.z-PZ)<1.1&&Math.abs(m.position.x-player.position.x)<1.1&&Math.abs(m.position.y-(player.position.y+1.2))<1.8){
        scene.remove(m); pickups.splice(i,1);
        if(p.kind==='coin'||p.kind==='gem'){ coins+=(p.kind==='gem'?5:1)*(x2T>0?2:1); coinsEl.textContent=coins; sfx.coin(); tg?.HapticFeedback?.impactOccurred?.('light'); }
        else { sfx.power(); runPower++; const k=p.kind;
          if(k==='shield') shield=true; else if(k==='magnet') magnetT=10; else if(k==='jetpack') jetT=6;
          else if(k==='boots') bootsT=10; else if(k==='x2') x2T=12; else if(k==='hover') hoverT=20; }
      }
    }
  }

  if(crashT>0&&!previewing){
    crashT=Math.max(0,crashT-dt); const t=1-crashT/.65;
    body.rotation.x=-1.35*Math.min(1,t*1.7); body.position.y=-.12*t;
    player.rotation.z=.65*t;
    limbs.arms.forEach((a,i)=>{a.shoulder.rotation.z=(i===0?1:-1)*(.4+t);});
  }
  if(previewing){
    crashT=0; body.rotation.set(.025,Math.PI,0); body.position.y=.025*Math.sin(now*.003);
    limbs.legs.forEach(l=>{l.hip.rotation.set(0,0,0);l.knee.rotation.set(0,0,0);});
    limbs.arms.forEach((a,i)=>{a.shoulder.rotation.set(0,0,i===0?.1:-.1);a.elbow.rotation.set(.15,0,0);});
    if(headRig)headRig.rotation.set(0,.06*Math.sin(now*.002),0);
    if(bagRig)bagRig.rotation.set(0,0,0);
  }
  updateWorld(dt,false);
  // Cámara suave + sacudida al chocar
  camX+=(player.position.x*.88-camX)*Math.min(1,dt*6);
  shake=Math.max(0,shake-dt);
  const sh=shake>0?(Math.random()-.5)*shake*.8:0;
  const fov=65+(speed-18)*.3; if(Math.abs(camera.fov-fov)>.05){ camera.fov=fov; camera.updateProjectionMatrix(); }
  if(previewing){ player.rotation.y+=dt*.38; camera.position.set(0,1.85,8.3); camera.lookAt(0,.85,3); }
  else { camera.position.set(camX+sh,4.1+player.position.y*.35+sh,9.0); camera.lookAt(camX,1.65,-3.2); }
  sun.position.set(player.position.x-5,12,player.position.z+4); sun.target.position.set(player.position.x,0,player.position.z-4);
  if(previewing){
    const hidden=scene.children.filter(o=>o!==player&&!o.isLight&&o!==sun.target&&o!==studio);
    const states=hidden.map(o=>o.visible);hidden.forEach(o=>o.visible=false);studio.visible=true;
    const bg=scene.background.clone();scene.background.set(0x18233b);renderer.render(scene,camera);scene.background.copy(bg);studio.visible=false;hidden.forEach((o,i)=>o.visible=states[i]);
  }else renderer.render(scene,camera);
}
const studio=new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.8,.16,48),M(0x435777,.55));studio.position.set(0,-.09,PZ);studio.receiveShadow=true;studio.visible=false;scene.add(studio);
requestAnimationFrame(animate);

/* Guardado integral V11: copia local y nube serializada */
const SAVEKEY='mr_profile_v11'; const BACKUP=SAVEKEY+'_backup';
let revision=0, pending=null, writing=false, readySave=false, localOK=false;
const saveLabel=document.createElement('div'); saveLabel.style.cssText='font-size:12px;color:#a9c8e8;margin:6px'; $('#lvl').after(saveLabel);
function snapshot(){return {rev:revision,best,wallet,owned:[...owned],cfg:{...cfg},sv:JSON.parse(JSON.stringify(sv))};}
function restore(d){if(!d||!Number.isFinite(d.rev)||!d.sv||!d.cfg)return false; revision=d.rev; best=Math.max(best,d.best||0); wallet=Math.max(0,d.wallet||0); owned.clear(); (d.owned||[]).forEach(x=>owned.add(x)); Object.assign(cfg,d.cfg); Object.assign(sv,d.sv); bestEl.textContent=best; buildCharacter(); updateMenu(); return true;}
function flushCloud(){if(writing||!pending||!tg?.CloudStorage?.setItem)return; const data=pending; pending=null; writing=true; try{tg.CloudStorage.setItem(SAVEKEY,data,(err,ok)=>{writing=false; if(err||ok===false){if(!pending)pending=data;saveLabel.textContent=localOK?'Guardado local · nube pendiente':'No se pudo guardar';return;} saveLabel.textContent=pending?'Sincronizando…':'Guardado en Telegram';flushCloud();});}catch(e){writing=false;pending=data;}}
function persist(){if(!readySave)return; revision=Math.max(Date.now(),revision+1); const data=JSON.stringify(snapshot()); try{const old=localStorage.getItem(SAVEKEY); if(old) localStorage.setItem(BACKUP,old); localStorage.setItem(SAVEKEY,data);localOK=true;}catch(e){localOK=false;} saveLabel.textContent=localOK?'Guardado en este navegador · no garantiza otra vista previa':'Almacenamiento local no disponible';pending=data;flushCloud();}
function cloudRead(key){return new Promise(resolve=>{if(!tg?.CloudStorage?.getItem)return resolve(null);let done=false;const end=v=>{if(!done){done=true;resolve(v);}};setTimeout(()=>end(null),3500);try{tg.CloudStorage.getItem(key,(err,v)=>end(err?null:v));}catch(e){end(null);}});}
async function initSave(){const buttons=['#start','#customBtn','#shopBtn','#missBtn','#statBtn'].map($);buttons.forEach(b=>b.disabled=true);saveLabel.textContent='Cargando progreso…';let local=null;try{local=JSON.parse(localStorage.getItem(SAVEKEY)||'null');}catch(e){} if(!local){try{local=JSON.parse(localStorage.getItem(BACKUP)||'null');}catch(e){}} let remote=null;try{remote=JSON.parse(await cloudRead(SAVEKEY)||'null');}catch(e){} try{const b=JSON.parse(localStorage.getItem(BACKUP)||'null');if(b&&(!local||b.rev>local.rev))local=b;}catch(e){} const chosen=remote&&(!local||remote.rev>local.rev)?remote:local; if(!restore(chosen)){const [b,c,w,v]=await Promise.all(['mr_best','mr_cfg','mr_wallet','mr_save'].map(cloudRead));try{best=Math.max(best,+b||0);const old=JSON.parse(v||'null');if(old&&old.xp>sv.xp){Object.assign(sv,old);const ow=JSON.parse(w||'null');if(ow){wallet=ow.wallet||0;(ow.owned||[]).forEach(x=>owned.add(x));}if(c)Object.assign(cfg,JSON.parse(c));}else if(w){const ow=JSON.parse(w);(ow.owned||[]).forEach(x=>owned.add(x));if(!sv.games)wallet=Math.max(wallet,ow.wallet||0);} }catch(e){} buildCharacter();bestEl.textContent=best;updateMenu();}readySave=true;if(local||remote)persist();else saveLabel.textContent='Perfil nuevo · guardado automático al jugar';buttons.forEach(b=>b.disabled=false);}
function bankRun(){if(!running)return;running=false;const d=Math.floor(score);wallet+=coins;finishRun(d,coins);if(d>best){best=d;bestEl.textContent=best;}persist();$('#message').textContent='Partida guardada · '+d+' m';$('#overlay').classList.remove('hidden');$('#pauseNotice').classList.add('hidden');}
addEventListener('pagehide',()=>{bankRun();persist();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){bankRun();persist();}else flushCloud();});
setInterval(()=>{if(pending)flushCloud();},5000);
initSave();


addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
